name: Scrape canasta sin gluten daily

on:
  schedule:
    # 12:00 UTC = 8:00 AM Asunción (UTC-4)
    - cron: '0 12 * * *'
  workflow_dispatch:  # permite ejecutar manualmente desde Actions UI

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests beautifulsoup4 lxml

      - name: Run scraper
        run: python scripts/scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/canasta.json
          if git diff --staged --quiet; then
            echo "Sin cambios en precios, skip commit"
          else
            git commit -m "scraper: actualizar precios canasta $(date -u +%Y-%m-%d)"
            git push
          fi
